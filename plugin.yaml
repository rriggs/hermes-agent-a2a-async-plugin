name: a2a-async
version: 0.5.0
description: "Complete asynchronous A2A client and inbound gateway contributed to the shared a2a toolset."
author: Rob Riggs
kind: platform
requires_hermes: ">=0.21.3"
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - a2a_submit
  - a2a_get_task
  - a2a_await
  - a2a_watch_cancel
  - a2a_acquire_task_ownership
  - a2a_release_task_ownership
  - a2a_cancel
  - a2a_discover
  - a2a_call
  - a2a_list
  - a2a_history
  - a2a_orchestrate
  - a2a_steer
provides_hooks:
  - on_session_start
  - on_session_reset
  - on_session_finalize
