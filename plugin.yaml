name: a2a-async
version: 0.1.6
description: "Complete asynchronous A2A client and inbound gateway contributed to the shared a2a toolset."
author: Rob Riggs
kind: platform
requires_hermes: ">=0.21.3"
platforms:
  - linux
  - macos
  - windows
provides_tools:
  - a2a_submit
  - a2a_get_task
  - a2a_await
  - a2a_cancel
  - a2a_discover
  - a2a_call
  - a2a_list
  - a2a_history
  - a2a_orchestrate
  - a2a_steer
